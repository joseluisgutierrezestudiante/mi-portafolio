<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario | Panel</title>
    <style>
        :root { font-family: Arial, sans-serif; color: #17202a; background: #f4f1e9; }
        * { box-sizing: border-box; } body { max-width: 1050px; margin: auto; padding: 32px 20px; }
        header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 30px; }
        h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -0.06em; } .eyebrow { color: #687166; font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; }
        .layout { display: grid; grid-template-columns: 1fr 1.5fr; gap: 18px; } .panel { padding: 22px; background: #fffdf8; border: 1px solid #d6d3c8; }
        form { display: grid; gap: 13px; } label { display: grid; gap: 5px; color: #687166; font-size: .8rem; } input { width: 100%; padding: 10px; border: 1px solid #d6d3c8; background: transparent; }
        button { padding: 10px 14px; border: 0; background: #2355ff; color: white; cursor: pointer; font-weight: bold; } button:hover { background: #173ccb; }
        .stats { display: flex; gap: 10px; margin-bottom: 14px; } .stat { padding: 12px; border: 1px solid #d6d3c8; flex: 1; } .stat strong { display: block; font-size: 1.4rem; }
        table { width: 100%; border-collapse: collapse; } th, td { padding: 12px 8px; border-bottom: 1px solid #e1ded4; text-align: left; font-size: .9rem; } th { color: #687166; font-size: .72rem; text-transform: uppercase; }
        .low { color: #ba4c32; font-weight: bold; } #message { min-height: 1.4em; color: #2355ff; }
        @media (max-width: 700px) { header, .layout { display: block; } header { margin-bottom: 24px; } .panel + .panel { margin-top: 16px; } table { font-size: .8rem; } }
    </style>
</head>
<body>
    <header><div><p class="eyebrow">Python · Flask · SQL</p><h1>Inventario</h1></div><p id="message" aria-live="polite"></p></header>
    <div class="layout">
        <section class="panel"><h2>Nuevo producto</h2><form id="product-form"><label>Nombre<input name="nombre" required placeholder="Teclado"></label><label>Categoría<input name="categoria" required placeholder="Accesorios"></label><label>Precio<input name="precio" required type="number" min="0" step="0.01" placeholder="25.50"></label><label>Stock<input name="stock" required type="number" min="0" step="1" placeholder="10"></label><button type="submit">Guardar producto</button></form></section>
        <section class="panel"><div class="stats"><div class="stat"><span>Productos</span><strong id="total">0</strong></div><div class="stat"><span>Stock bajo</span><strong id="low-total">0</strong></div></div><table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th></tr></thead><tbody id="product-list"></tbody></table></section>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
